# 用 Docker 内置 DNS（127.0.0.11）动态解析 api 主机名，
# 避免 api 容器重建后 IP 变化导致 nginx 缓存旧 IP 而 502。
# 关键：proxy_pass 用变量形式 + resolver，nginx 每次请求重新解析。

server {
    listen 80;
    server_name _;

    # Docker 内置 DNS 服务器
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # 反向代理后端 API（动态解析，避免 502）
    location /api/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 代理（动态解析）
    location /ws/ {
        set $upstream_ws http://api:8000;
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
